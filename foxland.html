<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FoxLand — подключение</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="https://raw.githubusercontent.com/shenol111/foxland/main/foxland.png">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0B0C0F;
  --amber:#F2761B;
  --ember:#C24E12;
  --silver:#DCDCDE;
  --muted:#8A8D96;
  --display:"Unbounded","Trebuchet MS",sans-serif;
  --body:"Manrope","Segoe UI",sans-serif;
  --mono:"JetBrains Mono","Consolas",monospace;
}

*{margin:0;padding:0;box-sizing:border-box}

html{background:var(--night);height:100%}

body{
  min-height:100vh;
  min-height:100dvh;
  width:100vw;
  overflow:hidden;
  background:var(--night);
  color:var(--silver);
  font-family:var(--body);
  position:relative;
}

/* ---- баннер на весь экран ---- */
.bg{
  position:fixed;
  inset:0;
  background-image:url("https://raw.githubusercontent.com/shenol111/foxland/main/foxland.png");
  background-size:cover;
  background-position:center 42%;
  background-repeat:no-repeat;
  background-color:var(--night);
}

/* затемнение снизу, чтобы текст читался поверх гор */
.scrim{
  position:fixed;
  inset:0;
  background:linear-gradient(to top,
    rgba(8,9,12,.96) 0%,
    rgba(8,9,12,.82) 14%,
    rgba(8,9,12,.35) 30%,
    transparent 48%);
  pointer-events:none;
}

/* ---- нижняя панель ---- */
.hud{
  position:fixed;
  left:0;right:0;bottom:0;
  z-index:3;
  padding:0 clamp(24px,4.5vw,72px) clamp(22px,3.2vh,38px);
  display:flex;
  flex-direction:column;
  gap:clamp(16px,2.4vh,26px);
}

.row{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:clamp(24px,4vw,64px);
}

/* правила слева */
.tips{
  border-left:2px solid var(--amber);
  padding-left:20px;
  min-height:96px;
  flex:1 1 auto;
}
.tips-eyebrow{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.32em;
  text-transform:uppercase;
  color:var(--amber);
  margin-bottom:12px;
}
.tip{
  opacity:0;
  transform:translateY(8px);
  transition:opacity .5s ease,transform .5s ease;
}
.tip.on{opacity:1;transform:none}
.tip h3{
  font-family:var(--display);
  font-weight:600;
  font-size:clamp(16px,1.5vw,21px);
  letter-spacing:-.01em;
  margin-bottom:7px;
}
.tip p{
  font-size:clamp(13px,1.05vw,15px);
  line-height:1.55;
  color:rgba(220,220,222,.72);
  max-width:46ch;
}

/* данные справа */
.facts{
  display:flex;
  gap:8px;
  flex:0 0 auto;
  flex-wrap:wrap;
  justify-content:flex-end;
}
.fact{
  border:1px solid rgba(220,220,222,.18);
  border-radius:2px;
  padding:8px 13px;
  font-family:var(--mono);
  font-size:11.5px;
  letter-spacing:.05em;
  background:rgba(11,12,15,.6);
  backdrop-filter:blur(3px);
}
.fact b{
  display:block;
  color:var(--muted);
  font-weight:400;
  text-transform:uppercase;
  letter-spacing:.18em;
  font-size:9px;
  margin-bottom:4px;
}

/* ---- тропа следов = прогресс ---- */
.meta{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.07em;
  color:var(--muted);
  margin-bottom:10px;
  gap:20px;
}
#file{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:65%;
}
#pct{color:var(--amber);font-weight:700}

.paws{
  display:flex;
  align-items:flex-end;
  gap:clamp(4px,1vw,13px);
  height:clamp(20px,2.6vh,30px);
}
.paw{
  flex:1;
  height:100%;
  opacity:.13;
  transform:translateY(3px);
  transition:opacity .45s ease,transform .45s ease;
}
.paw:nth-child(even){transform:translateY(8px)}
.paw.lit{opacity:1;transform:translateY(0)}
.paw:nth-child(even).lit{transform:translateY(5px)}
.paw svg{width:100%;height:100%;display:block}

@media (max-width:820px){
  .row{flex-direction:column;align-items:stretch}
  .facts{justify-content:flex-start}
  .bg{background-position:center 30%}
}

@media (prefers-reduced-motion:reduce){
  .tip,.paw{transition:none}
}
</style>
</head>
<body>

<div class="bg"></div>
<div class="scrim"></div>

<div class="hud">
  <div class="row">
    <div class="tips">
      <div class="tips-eyebrow">Пока грузится</div>
      <div class="tip" id="tip">
        <h3></h3>
        <p></p>
      </div>
    </div>

    <div class="facts">
      <div class="fact"><b>Карта</b><span id="map">загружается</span></div>
      <div class="fact"><b>Режим</b><span id="mode">darkrp</span></div>
      <div class="fact"><b>Слотов</b><span id="slots">32</span></div>
    </div>
  </div>

  <div>
    <div class="meta">
      <span id="file">Устанавливаем соединение…</span>
      <span id="pct">0%</span>
    </div>
    <div class="paws" id="paws"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var PAWS = 18;
  var pawsBox = document.getElementById("paws");
  var pawSVG =
    '<svg viewBox="0 0 30 34" aria-hidden="true">' +
      '<ellipse cx="15" cy="24" rx="8.5" ry="7.5" fill="#F2761B"/>' +
      '<ellipse cx="5"  cy="12" rx="3.4" ry="4.4" fill="#F2761B"/>' +
      '<ellipse cx="12" cy="7"  rx="3.4" ry="4.6" fill="#F2761B"/>' +
      '<ellipse cx="19" cy="7"  rx="3.4" ry="4.6" fill="#F2761B"/>' +
      '<ellipse cx="26" cy="12" rx="3.4" ry="4.4" fill="#F2761B"/>' +
    '</svg>';

  var paws = [];
  for (var i = 0; i < PAWS; i++) {
    var el = document.createElement("div");
    el.className = "paw";
    el.innerHTML = pawSVG;
    pawsBox.appendChild(el);
    paws.push(el);
  }

  var pctEl  = document.getElementById("pct");
  var fileEl = document.getElementById("file");
  var shown  = 0;
  var target = 0;

  function render(p){
    p = Math.max(0, Math.min(1, p));
    pctEl.textContent = Math.round(p * 100) + "%";
    var lit = Math.round(p * PAWS);
    for (var i = 0; i < PAWS; i++){
      paws[i].classList.toggle("lit", i < lit);
    }
  }

  setInterval(function(){
    if (shown < target) {
      shown = Math.min(target, shown + 0.012);
      render(shown);
    }
  }, 40);

  /* ---------- хуки Garry's Mod ---------- */
  var total = 0, needed = 0;

  window.SetFilesTotal = function(t){
    total = t || 0;
  };

  window.SetFilesNeeded = function(n){
    needed = n || 0;
    if (total > 0) target = (total - needed) / total;
    if (needed === 0 && total > 0) {
      target = 1;
      fileEl.textContent = "Заходим на сервер";
    }
  };

  window.DownloadingFile = function(name){
    if (!name) return;
    name = String(name).replace(/^.*[\\\/]/, "");
    fileEl.textContent = "Загрузка: " + name;
  };

  window.GameDetails = function(servername, serverurl, mapname, maxplayers, steamid, gamemode){
    if (mapname)    document.getElementById("map").textContent   = mapname;
    if (gamemode)   document.getElementById("mode").textContent  = gamemode;
    if (maxplayers) document.getElementById("slots").textContent = maxplayers;
  };

  (function(){
    var q = new URLSearchParams(location.search);
    if (q.get("mapname"))    document.getElementById("map").textContent   = q.get("mapname");
    if (q.get("gamemode"))   document.getElementById("mode").textContent  = q.get("gamemode");
    if (q.get("maxplayers")) document.getElementById("slots").textContent = q.get("maxplayers");
  })();

  /* ---------- правила по кругу ---------- */
  var TIPS = [
    ["RDM запрещён",       "Убивать без отыгрыша нельзя. Нужна причина, которую ты сможешь объяснить админу."],
    ["NLR — 3 минуты",     "После смерти забываешь всё, что было до неё, и не возвращаешься на место гибели три минуты."],
    ["Рейд с поводом",     "Врываться в базу просто так нельзя. Нужен мотив: долг, конфликт, заказ."],
    ["Держи роль",         "Взял мэра — правь. Взял бандита — грабь. Смена работы каждые две минуты ломает игру всем."],
    ["Базы честные",       "Никаких мазе-баз и невидимых проходов. Заходить должно быть возможно."],
    ["Не пиши в OOC",      "Обычный чат — это речь персонажа. Всё внеигровое пиши через /ooc."],
    ["Проблема? /report",  "Не устраивай самосуд. Напиши /report — админ разберётся."],
    ["Discord FoxLand",    "Жалобы, заявки на админку и анонсы — в нашем Discord. Ссылка в чате сервера."]
  ];

  var tipBox = document.getElementById("tip");
  var tipH   = tipBox.querySelector("h3");
  var tipP   = tipBox.querySelector("p");
  var idx    = Math.floor(Math.random() * TIPS.length);

  function showTip(){
    tipBox.classList.remove("on");
    setTimeout(function(){
      tipH.textContent = TIPS[idx][0];
      tipP.textContent = TIPS[idx][1];
      tipBox.classList.add("on");
      idx = (idx + 1) % TIPS.length;
    }, 450);
  }

  showTip();
  setInterval(showTip, 7000);
})();
</script>
</body>
</html>
